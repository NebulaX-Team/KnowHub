version: '3.8'

services:
  knowhub:
    image: ghcr.io/nebulax-team/knowhub:latest
    container_name: knowhub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/db/knowhub-database.sqlite
      - JWT_SECRET=!!!CHANGE_THIS!!!
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
    volumes:
      - ./db:/app/db
      - ./uploads:/app/uploads
