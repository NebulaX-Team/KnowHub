version: '3.8'

services:
  knowhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowhub:local
    container_name: knowhub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=sqlite
      - DB_PATH=/app/db/knowhub-database.sqlite
      # PostgreSQL example:
      # - DB_TYPE=postgres
      # - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/knowhub
      # - PGSSL=false
      - JWT_SECRET=!!!CHANGE_THIS!!!
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
    volumes:
      - ./db:/app/db
      - ./uploads:/app/uploads
